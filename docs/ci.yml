name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd apps/api
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint & Format Check
        run: |
          cd apps/api
          uv run ruff check app tests
          uv run ruff format --check app tests

      - name: Run Mypy Type Checker
        run: |
          cd apps/api
          uv run mypy app

      - name: Run Pytest with Coverage
        run: |
          cd apps/api
          uv run pytest --cov=app --cov-report=term-missing --cov-report=xml tests/

      - name: Run Security Audit (pip-audit)
        run: |
          cd apps/api
          uv run pip-audit || echo "Audit check completed"

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm ci || npm install

      - name: Run ESLint
        run: |
          cd apps/web
          npm run lint

      - name: Run TypeScript typecheck
        run: |
          cd apps/web
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          cd apps/web
          npm test -- --run

      - name: Build Frontend Distribution
        run: |
          cd apps/web
          npm run build
